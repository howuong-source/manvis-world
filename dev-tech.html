<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【MVP 測試】絕對根路徑圖片測試</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #FAFAFC; color: #1E293B; padding: 40px 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .room-card { padding: 36px; background-color: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .character-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
        .char-card { background-color: #F8FAFC; border: 1px solid #E2E8F0; padding: 24px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; text-align: center; }
        .char-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 3px solid #0066FF; background-color: #E2E8F0; margin-bottom: 14px; }
        .quote { font-style: italic; color: #64748B; font-size: 14px; margin-top: 12px; border-top: 1px dashed #E2E8F0; padding-top: 10px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <div class="room-card">
            <h1 style="font-size: 24px; color: #0F172A; margin-bottom: 8px;">🚀 絕對根路徑 (`/images/`) 測試大廳</h1>
            <p style="color: #475569; font-size: 15px;">如果圖片順利顯示，代表絕對根路徑在 Cloudflare / GitHub Pages 上完全跑通！</p>
            
            <div style="margin-top: 30px;">
                <h2 style="font-size: 18px; color: #0F172A; border-left: 4px solid #0066FF; padding-left: 10px;">主要人物看板</h2>
                
                <div class="character-grid">
                    <!-- 1. 雷神師傅 (使用絕對根路徑 /images/master-avatar.jpg) -->
                    <div class="char-card">
                        <img src="/images/master-avatar.jpg" alt="👴 高階 AI 師傅：雷神 (Master)" class="char-avatar">
                        <strong style="font-size: 18px; color: #0F172A;">👴 高階 AI 師傅：雷神 (Master)</strong>
                        <p style="font-size: 14px; margin-top: 6px; color: #475569;">技術總監。嘴毒心軟，有極嚴重的代碼潔癖與極致的架構強迫症。</p>
                        <p class="quote">"不要跟我炫耀你用了多厲害的框架，在手機螢幕只有 300 像素時，你的代碼能動才是真本事。"</p>
                    </div>
                
                    <!-- 2. 阿爆實習生 (使用絕對根路徑 /images/intern-avatar.jpg) -->
                    <div class="char-card">
                        <img src="/images/intern-avatar.jpg" alt="👶 AI 實習生：阿爆 (Intern)" class="char-avatar">
                        <strong style="font-size: 18px; color: #0F172A;">👶 AI 實習生：阿爆 (Intern)</strong>
                        <p style="font-size: 14px; margin-top: 6px; color: #475569;">菜鳥實習生。熱愛炫技、自作聰明，天天在網上複製貼上奇怪的外部代碼。</p>
                        <p class="quote">"奇怪...這在我的本機明明就可以跑啊......"</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
